[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repoflow-ai"
version = "0.1.0"
description = "Evidence-grounded repository learning platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
dev = ["ruff>=0.6,<1", "mypy>=1.11,<2"]
ml = ["torch>=2.4,<3"]
media = ["Pillow>=10,<13", "imageio-ffmpeg>=0.5,<1", "pocket-tts>=4,<5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["test_pocket_tts.py"]

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
exclude = "(^|/)(storage|frontend|fixtures|test_pocket_tts\\.py$)"

[tool.setuptools.packages.find]
include = ["backend*"]
