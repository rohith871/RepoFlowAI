
services:
  # Backend: FastAPI
  - type: web
    name: repoflow-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      - key: REPOFLOW_STORAGE_DIR
        value: /tmp/repoflow

      - key: LLM_PRIMARY_PROVIDER
        value: groq

      - key: LLM_FALLBACK_ENABLED
        value: "false"

      - key: GROQ_API_KEY
        sync: false

      - key: GROQ_MODEL
        value: openai/gpt-oss-120b

      - key: FRONTEND_ORIGINS
        sync: false

  # Frontend: React + Vite
  - type: web
    name: repoflow-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist

    envVars:
      - key: VITE_API_BASE_URL
        sync: false

    routes:
      - type: rewrite
        source: /*
        destination: /index.html
